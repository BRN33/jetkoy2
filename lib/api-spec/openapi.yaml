openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: JetKöy API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: jobs
    description: Job pool operations
  - name: wallet
    description: Wallet and credit operations
  - name: admin
    description: Admin operations
  - name: storage
    description: Object storage operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Phone already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Login with phone and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/send-otp:
    post:
      operationId: sendOtp
      tags: [auth]
      summary: Send a 4-digit OTP to the given phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOtpRequest"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendOtpResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Phone already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify-otp:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Verify OTP and complete registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Phone already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile:
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update own profile (name, plate, password)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve a stored object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary

  /profile/push-token:
    patch:
      operationId: updatePushToken
      tags: [auth]
      summary: Register or update Expo push token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pushToken]
              properties:
                pushToken:
                  type: string
      responses:
        "200":
          description: Push token saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List available jobs in the pool
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of available jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a new job in the pool
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get job details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs/{id}/grab:
    post:
      operationId: grabJob
      tags: [jobs]
      summary: Grab a job from the pool
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job grabbed successfully with contact details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrabJobResponse"
        "400":
          description: Insufficient credits or job already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs/my:
    get:
      operationId: getMyJobs
      tags: [jobs]
      summary: Get jobs created by current user and jobs grabbed by current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: My jobs summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyJobsSummary"

  /wallet:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Get current user wallet info
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Wallet info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"

  /wallet/commissions:
    get:
      operationId: getCommissions
      tags: [wallet]
      summary: Get commission records
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Commission records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionSummary"

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List all users (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{id}/credits:
    post:
      operationId: adminAddCredits
      tags: [admin]
      summary: Add credits to a user (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCreditsRequest"
      responses:
        "200":
          description: Credits added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /messages:
    get:
      operationId: getMyMessages
      tags: [messages]
      summary: Get current user's messages and admin replies
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserMessage"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message to admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMessage"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/messages:
    get:
      operationId: adminGetMessages
      tags: [admin]
      summary: Get all user messages (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminMessage"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/messages/send:
    post:
      operationId: adminSendMessage
      tags: [admin]
      summary: Send a message to a specific user (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSendMessageRequest"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMessage"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/messages/{id}/delete:
    post:
      operationId: adminDeleteMessage
      tags: [admin]
      summary: Delete a message (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Message deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/messages/{id}/keep:
    post:
      operationId: adminKeepMessage
      tags: [admin]
      summary: Toggle keep flag on a message (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Keep flag toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMessage"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/messages/{id}/reply:
    post:
      operationId: adminReplyMessage
      tags: [admin]
      summary: Reply to a user message (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReplyRequest"
      responses:
        "200":
          description: Reply sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMessage"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{id}:
    delete:
      operationId: adminDeleteUser
      tags: [admin]
      summary: Delete a user (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: adminEditUser
      tags: [admin]
      summary: Edit user details (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminEditUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{id}/vip:
    post:
      operationId: adminSetVip
      tags: [admin]
      summary: Toggle VIP status for a user (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetVipRequest"
      responses:
        "200":
          description: VIP status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error

    RegisterRequest:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        plate:
          type: string
        password:
          type: string
      required:
        - fullName
        - phone
        - plate
        - password

    LoginRequest:
      type: object
      properties:
        phone:
          type: string
        password:
          type: string
      required:
        - phone
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    User:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
        phone:
          type: string
        plate:
          type: string
        credits:
          type: number
        isVip:
          type: boolean
        isAdmin:
          type: boolean
        createdAt:
          type: string
        avatarUrl:
          type: string
          nullable: true
      required:
        - id
        - fullName
        - phone
        - plate
        - credits
        - isVip
        - isAdmin
        - createdAt

    Job:
      type: object
      properties:
        id:
          type: string
        creatorId:
          type: string
        creatorName:
          type: string
        creatorPlate:
          type: string
        departure:
          type: string
        destination:
          type: string
        departureLat:
          type: number
          nullable: true
        departureLng:
          type: number
          nullable: true
        passengerName:
          type: string
        passengerPhoneMasked:
          type: string
        totalFare:
          type: number
        commission:
          type: number
        status:
          type: string
          enum: [available, grabbed]
        createdAt:
          type: string
      required:
        - id
        - creatorId
        - creatorName
        - creatorPlate
        - departure
        - destination
        - passengerName
        - passengerPhoneMasked
        - totalFare
        - commission
        - status
        - createdAt

    JobDetail:
      type: object
      properties:
        id:
          type: string
        creatorId:
          type: string
        creatorName:
          type: string
        creatorPlate:
          type: string
        departure:
          type: string
        destination:
          type: string
        passengerName:
          type: string
        passengerPhone:
          type: string
        totalFare:
          type: number
        commission:
          type: number
        status:
          type: string
          enum: [available, grabbed]
        grabbedById:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - creatorId
        - creatorName
        - creatorPlate
        - departure
        - destination
        - passengerName
        - passengerPhone
        - totalFare
        - commission
        - status
        - createdAt

    GrabJobResponse:
      type: object
      properties:
        job:
          $ref: "#/components/schemas/JobDetail"
        passengerPhone:
          type: string
        newCreditBalance:
          type: number
      required:
        - job
        - passengerPhone
        - newCreditBalance

    CreateJobRequest:
      type: object
      properties:
        departure:
          type: string
        destination:
          type: string
        departureLat:
          type: number
          nullable: true
        departureLng:
          type: number
          nullable: true
        passengerName:
          type: string
        passengerPhone:
          type: string
        totalFare:
          type: number
        commission:
          type: number
      required:
        - departure
        - destination
        - passengerName
        - passengerPhone
        - totalFare
        - commission

    MyJobsSummary:
      type: object
      properties:
        createdJobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        grabbedJobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
      required:
        - createdJobs
        - grabbedJobs

    Wallet:
      type: object
      properties:
        credits:
          type: number
        totalEarned:
          type: number
        totalSpent:
          type: number
      required:
        - credits
        - totalEarned
        - totalSpent

    CommissionSummary:
      type: object
      properties:
        receivable:
          type: array
          items:
            $ref: "#/components/schemas/CommissionRecord"
        payable:
          type: array
          items:
            $ref: "#/components/schemas/CommissionRecord"
      required:
        - receivable
        - payable

    CommissionRecord:
      type: object
      properties:
        id:
          type: string
        jobId:
          type: string
        departure:
          type: string
        destination:
          type: string
        amount:
          type: number
        driverName:
          type: string
        driverPlate:
          type: string
        status:
          type: string
          enum: [pending, paid]
        createdAt:
          type: string
      required:
        - id
        - jobId
        - departure
        - destination
        - amount
        - driverName
        - driverPlate
        - status
        - createdAt

    AdminUser:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
        phone:
          type: string
        plate:
          type: string
        credits:
          type: number
        isVip:
          type: boolean
        isAdmin:
          type: boolean
        jobsCreated:
          type: number
        jobsGrabbed:
          type: number
        createdAt:
          type: string
      required:
        - id
        - fullName
        - phone
        - plate
        - credits
        - isVip
        - isAdmin
        - jobsCreated
        - jobsGrabbed
        - createdAt

    AdminEditUserRequest:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        plate:
          type: string
        credits:
          type: number
        isVip:
          type: boolean
        isAdmin:
          type: boolean

    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
        plate:
          type: string
        currentPassword:
          type: string
        newPassword:
          type: string

    AddCreditsRequest:
      type: object
      properties:
        amount:
          type: number
        note:
          type: string
      required:
        - amount

    SetVipRequest:
      type: object
      properties:
        isVip:
          type: boolean
      required:
        - isVip

